name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  version-and-security-gate:
    name: Security Gate & Version Parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Validate version parity across packages and Cargo crate
        run: node scripts/sync-version.mjs --check

      - name: Generate and publish external audit log anchor
        run: node scripts/anchor-audit-digest.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload external audit anchor
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-change-audit-anchor
          path: safe-change-audit-anchor.json
          if-no-files-found: error

      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format cyclonedx > safe-change-sbom.cdx.json

      - name: Upload software bill of materials
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: safe-change-sbom
          path: safe-change-sbom.cdx.json
          if-no-files-found: error

      - name: Ensure working tree is clean after sync check
        run: git diff --exit-code

  test:
    name: Lint, Build, and Test (${{ matrix.os }})
    needs: version-and-security-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@safe-change.local"
          git config --global user.name "CI Runner"

      - name: Install bubblewrap for live Linux OS sandbox verification
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Evaluate the labeled semantic corpus using the built engine
        run: node tests/benchmarks/semantic-corpus.mjs

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Upload measured Ubuntu source coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measured-source-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: error

      - name: Dogfood source-bound release evidence
        if: matrix.os == 'ubuntu-latest'
        run: node scripts/release-evidence.mjs
      - name: Upload checkable release self-evidence
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-bundle
          path: |
            ${{ runner.temp }}/release-evidence.tar.gz
            ${{ runner.temp }}/release-evidence.tar.gz.sha256
          if-no-files-found: error

  smoke-test:
    name: Package Tarball Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Pack release tarball
        run: npm pack

      - name: Run smoke tests against packed tarball
        run: node scripts/smoke-test-tarball.mjs

  publish-coverage:
    name: Publish measured public source coverage
    needs: [test, smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: measured-coverage-main
      cancel-in-progress: false
    steps:
      - name: Checkout the measured commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 22.x
      - name: Download this run's measured source coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: measured-source-coverage
          path: coverage
      - name: Publish provenance and measured badge to report-only branch
        run: node scripts/publish-coverage.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
