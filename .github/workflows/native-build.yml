name: Native Module CI and Distribution

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
            pkg_name: "@safe-change/linux-x64-gnu"
          - os: ubuntu-24.04-arm
            target: linux-arm64-gnu
          - os: ubuntu-latest
            target: linux-x64-musl
          - os: windows-latest
            target: win32-x64-msvc
            pkg_name: "@safe-change/win32-x64-msvc"
          - os: macos-latest
            target: darwin-arm64
            pkg_name: "@safe-change/darwin-arm64"
          - os: macos-15-intel
            target: darwin-x64
            pkg_name: "@safe-change/darwin-x64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@safe-change.local"
          git config --global user.name "CI Runner"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install musl cross-linker and Rust standard library
        if: matrix.target == 'linux-x64-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify TypeScript fallback without native binary
        run: npm test
        env:
          SAFE_CHANGE_NATIVE_DISABLED: "1"

      - name: Run Rust unit tests
        run: |
          cd crates/safe-change-native
          cargo test
        shell: bash

      - name: Build Native Module for ${{ matrix.target }}
        run: |
          cd crates/safe-change-native
          if [ "${{ matrix.target }}" = "linux-x64-musl" ]; then
            CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc RUSTFLAGS="-C target-feature=-crt-static" npx napi build --platform --release --target x86_64-unknown-linux-musl
          else
            npx napi build --platform --release
          fi
        shell: bash

      - name: Verify generated native binary exists
        run: |
          ls -la crates/safe-change-native/*.node
        shell: bash

      - name: Verify native module load and execution
        if: matrix.target != 'linux-x64-musl'
        run: |
          node scripts/verify-built-native.mjs ${{ matrix.target }}
          npx vitest run tests/native/
        shell: bash

      - name: Execute musl native binary and native tests in Alpine
        if: matrix.target == 'linux-x64-musl'
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace node:22-alpine sh -ec '
            npm ci
            node scripts/verify-built-native.mjs linux-x64-musl
            npx vitest run tests/native/
          '
        shell: bash

      - name: Upload native artifact for ${{ matrix.target }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-binary-${{ matrix.target }}
          path: crates/safe-change-native/*.node
          if-no-files-found: error
