name: Public Package Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-package:
    name: Build compatibility tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-root-tarball
          path: safe-change-*.tgz
          if-no-files-found: error

  clean-install:
    name: Clean install (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: compatibility-root-tarball
          path: compatibility-artifact
      - name: Verify exact tarball install, doctor, strict checks, MCP and packaged Java
        shell: bash
        run: node scripts/smoke-test-tarball.mjs --tarball "$(find compatibility-artifact -maxdepth 1 -type f -name 'safe-change-*.tgz' -print -quit)"
        env:
          SAFE_CHANGE_TEST_PACKAGED_JAVA: "1"
