name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    name: Release Validation & npm Preflight
    runs-on: ubuntu-latest
    environment: npm-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata and version parity
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/validate-release.mjs --allow-unreleased
          else
            node scripts/validate-release.mjs "${{ github.ref_name }}" --require-tag
          fi

      - name: Preflight npm credentials and package version status
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/preflight-npm.mjs --dry-run
          else
            node scripts/preflight-npm.mjs
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-native:
    name: Build & Verify Native (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
          - os: windows-latest
            target: win32-x64-msvc
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure git for tests
        run: |
          git config --global user.email "ci@safe-change.local"
          git config --global user.name "CI Runner"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify TypeScript fallback without native binary
        run: npm test
        env:
          SAFE_CHANGE_NATIVE_DISABLED: "1"

      - name: Run Rust unit tests
        run: |
          cd crates/safe-change-native
          cargo test
        shell: bash

      - name: Build Native Module for ${{ matrix.target }}
        run: |
          cd crates/safe-change-native
          npx napi build --platform --release
        shell: bash

      - name: Verify generated native binary exists
        run: |
          ls -la crates/safe-change-native/*.node
        shell: bash

      - name: Verify native module load and execution
        run: |
          node scripts/verify-built-native.mjs ${{ matrix.target }}
          npx vitest run tests/native/
        shell: bash

      - name: Upload native artifact for ${{ matrix.target }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-binary-${{ matrix.target }}
          path: crates/safe-change-native/*.node
          if-no-files-found: error

  build-root:
    name: Build & Pack Root Package
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Version parity check
        run: node scripts/sync-version.mjs --check

      - name: Smoke test package tarball
        run: node scripts/smoke-test-tarball.mjs

      - name: Pack root distribution tarball
        run: npm pack

      - name: Generate CycloneDX software bill of materials
        run: npm sbom --sbom-format cyclonedx > safe-change-sbom.cdx.json

      - name: Upload root tarball artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: root-package-tarball
          path: |
            safe-change-*.tgz
            safe-change-sbom.cdx.json
          if-no-files-found: error

  publish-native:
    name: Publish Native Platform Packages
    needs: [preflight, build-native]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    environment: npm-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Download all native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Orchestrate exact native tarball publication
        run: node scripts/publish-orchestrator.mjs --phase native
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-root:
    name: Publish Root safe-change Package
    needs: [preflight, build-root, publish-native]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Download root tarball artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: root-package-tarball
          path: .

      - name: Publish exact verified root tarball
        run: node scripts/publish-orchestrator.mjs --phase root
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate external audit log anchor for release attestation
        run: node scripts/anchor-audit-digest.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" --prerelease --latest=false \
              --title "$RELEASE_TAG — Experimental Developer Preview" \
              --generate-notes safe-change-*.tgz safe-change-sbom.cdx.json safe-change-audit-anchor.json
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes safe-change-*.tgz safe-change-sbom.cdx.json safe-change-audit-anchor.json
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}

  dry-run-artifacts:
    name: Verify Exact Release Artifacts (Dry Run)
    needs: [build-native, build-root]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.2.0
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-binary-*
          path: artifacts

      - name: Download root tarball artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: root-package-tarball
          path: .

      - name: Verify exact native and root artifacts without publishing
        run: node scripts/publish-orchestrator.mjs --dry-run
